name: Veles Daily Posts

on:
  schedule:
    # Время по UTC (МСК = UTC+3)
    - cron: '0 7 * * *'    # 10:00 МСК — slot 0 (editorial новость)
    - cron: '0 11 * * *'   # 14:00 МСК — slot 1 (promo новость)
    - cron: '0 15 * * *'   # 18:00 МСК — slot 2 (лайфхак / разбор)
  workflow_dispatch:
    inputs:
      command:
        description: 'Команда: run | welcome | slot 0 | slot 1 | slot 2'
        required: false
        default: 'run'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore sent.json from cache
        uses: actions/cache@v4
        with:
          path: sent.json
          key: veles-sent-${{ github.run_id }}
          restore-keys: |
            veles-sent-

      - name: Determine slot from cron
        id: slot
        run: |
          # Манульный запуск — берём команду из inputs
          if [ -n "${{ github.event.inputs.command }}" ]; then
            echo "cmd=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Автозапуск по cron — определяем slot по времени UTC
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "07" ]; then
            echo "cmd=slot 0" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "11" ]; then
            echo "cmd=slot 1" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "15" ]; then
            echo "cmd=slot 2" >> $GITHUB_OUTPUT
          else
            echo "cmd=run" >> $GITHUB_OUTPUT
          fi

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          MODERATION_MODE: ${{ secrets.MODERATION_MODE }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CONTACT_HANDLE: ${{ secrets.CONTACT_HANDLE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py ${{ steps.slot.outputs.cmd }}

      - name: Upload sent.json artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sent-history
          path: sent.json
          retention-days: 30
