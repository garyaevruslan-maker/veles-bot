name: Veles Daily Post

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'Команда: run | welcome'
        required: false
        default: 'run'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore sent.json from cache
        uses: actions/cache@v4
        with:
          path: sent.json
          key: veles-sent-${{ github.run_id }}
          restore-keys: |
            veles-sent-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          MODERATION_MODE: ${{ secrets.MODERATION_MODE }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CONTACT_HANDLE: ${{ secrets.CONTACT_HANDLE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py ${{ github.event.inputs.command || 'run' }}

      - name: Upload sent.json artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sent-history
          path: sent.json
          retention-days: 30
