name: Veles Daily Posts

on:
  schedule:
    # МСК = UTC+3
    - cron: '0 7 * * *'    # 10:00 МСК — slot 0
    - cron: '0 11 * * *'   # 14:00 МСК — slot 1
    - cron: '0 15 * * *'   # 18:00 МСК — slot 2
  workflow_dispatch:
    inputs:
      command:
        description: 'Команда: auto | welcome | slot 0 | slot 1 | slot 2'
        required: false
        default: 'auto'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ВАЖНО: стабильный ключ кеша. Так история постов копится между запусками.
      - name: Restore sent.json from cache
        uses: actions/cache@v4
        with:
          path: sent.json
          key: veles-sent-history-${{ github.run_id }}
          restore-keys: |
            veles-sent-history-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          MODERATION_MODE: ${{ secrets.MODERATION_MODE }}
          SITE_URL: ${{ secrets.SITE_URL }}
          CONTACT_HANDLE: ${{ secrets.CONTACT_HANDLE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py ${{ github.event.inputs.command || 'auto' }}

      - name: Save sent.json artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sent-history-${{ github.run_id }}
          path: sent.json
          retention-days: 90
